<!doctype html>
<html lang="en" class="crt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="GinaCities social media link page" />
    <meta name="author" content="Gina Giannetti" />
    <title>GinaCities Links</title>

    <!-- Favicons -->
    <link rel="icon" href="../assets/AdobeStock_1668008849.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="../assets/AdobeStock_1668008849.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/AdobeStock_1668008849.png" sizes="180x180" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="209d67bd-268a-4c17-9a15-a01c26768d9b"></script>
    <style>
      :root{
        --pink:#ffd3ec;
        --lav:#e9ddff;
        --lav-2:#d9ccff;
        --violet:#a88ff4;
        --ink:#2c2137;
        --white:#fff;
        --shadow:#c1b3ff;
        --dark:#5a5493;

        --bg-url: url('../assets/backgrounds/light.jpeg');
        --card-bg: rgba(255,255,255,0.92);
        --btn-bg: var(--lav);
        --btn-fg: var(--ink);
      }

      :root[data-theme="dark"]{
        --bg-url: url('../assets/backgrounds/dark.jpeg');
        --card-bg: rgba(90,84,147,0.88);
        --btn-bg: #5a5493;
        --btn-fg: #ffffff;
      }

      @font-face{
        font-family:"Harnold Pixel";
        src:url("../assets/HarnoldPixel-Regular_demo.otf") format("opentype");
        font-weight:400;
        font-style:normal;
        font-display:swap;
      }

      *{ box-sizing:border-box; }

      body{
        margin:0;
        min-height:100vh;
        font-family: "Pixelify Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        font-weight:300;
        letter-spacing:.15px;
        color:var(--ink);
        background-image: var(--bg-url);
        background-size: cover;
        background-position: center;
        overflow-x:hidden;
      }

      /* scanlines / texture */
      body::after{
        content:"";
        position:fixed; inset:0;
        background:
          repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 4px),
          repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px);
        pointer-events:none;
        mix-blend-mode: soft-light;
      }

      /* crt overlay (optional – matches your homepage vibe) */
      .crt{
        position:relative;
        filter: contrast(1.1) brightness(0.9) saturate(1.2);
        image-rendering: pixelated;
      }
      .crt::before{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:9999;
        background:
          linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
          linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
        background-size:100% 2px, 3px 100%;
        animation: crt-flicker 1.2s infinite;
      }
      @keyframes crt-flicker{
        0%{opacity:.95} 50%{opacity:1} 100%{opacity:.9}
      }

      /* mode button (ported, simplified) */
      .mode-toggle{
        position: fixed;
        left: 14px;
        top: 14px;
        z-index: 99;
        cursor: pointer;
        display:inline-flex;
        align-items:center;
        gap:8px;

        border:2px solid var(--violet);
        background: var(--btn-bg);
        color: var(--btn-fg);
        padding:6px 10px;
        font-weight:800;
        box-shadow: 3px 3px 0 0 var(--shadow);
        border-radius:10px;

        transition: transform .12s ease;
      }
      .mode-toggle:hover{ 
        transform: translate(-1px,-1px); 
        background: var(--dark);
        color: var(--white);
    }
      .mode-toggle:focus-visible{ outline:3px solid var(--dark); outline-offset:3px; }

      /* tiny pixel icon */
      .icon{
        width:16px; height:16px; fill: currentColor; vertical-align:-2px;
      }
      .icon.pixel path{ shape-rendering: crispEdges; }

      /* falling petals layer */
      .rain{
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .petal{
        position:absolute;
        top:-10%;
        font-size:14px;
        opacity:.9;
        filter: drop-shadow(0 0 3px rgba(255,255,255,.6));
        animation: fall linear forwards;
      }
      @keyframes fall{
        to{ transform: translateY(120vh) rotate(360deg); opacity:.95; }
      }
      @media (prefers-reduced-motion: reduce){
        .petal{ animation: none; }
      }

      /* stars */
      .stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }
      .star{
        position:absolute;
        background:#fff;
        border-radius:50%;
        box-shadow:0 0 8px 2px rgba(255,255,255,.7);
        animation: twinkle 3.6s ease-in-out infinite alternate;
      }
      @keyframes twinkle{
        from{opacity:.35; transform:scale(.75)}
        to{opacity:1; transform:scale(1.2)}
      }

      /* centered link card */
      .wrap{
        position:relative;
        z-index:1;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:28px 16px;
      }
      .card{
        width:100%;
        max-width:420px;
        border:3px solid var(--violet);
        background: var(--card-bg);
        box-shadow: 6px 6px 0 0 var(--shadow);
        border-radius:16px;
        padding:18px 16px 16px;
        backdrop-filter: blur(2px);
        color: var(--btn-fg);
      }

      .logo{ text-align:center; margin-bottom:12px; }
      .title{
        font-family:"Harnold Pixel", cursive;
        font-size:44px;
        letter-spacing:1px;
        text-shadow: 2px 2px var(--violet);
        line-height:1.05;
        margin:0;
      }
      .subtitle{
        margin:8px 0 0;
        font-size:16px;
        font-weight:700;
        opacity:.95;
      }
      .meta{
        margin:10px 0 14px;
        text-align:center;
        font-size:13px;
        opacity:.95;
      }

      .links{
        display:flex;
        flex-direction:column;
        gap:10px;
        margin-top:12px;
      }
      .pill{
        display:flex;
        align-items:center;
        justify-content:center;
        width:100%;
        padding:12px 12px;
        border:2px solid var(--violet);
        background: var(--lav);
        color: var(--ink);
        border-radius:12px;
        font-weight:900;
        text-decoration:none;
        box-shadow: 3px 3px 0 0 var(--shadow);
        transition: transform .12s ease, background .12s ease, color .12s ease;
      }
      :root[data-theme="dark"] .pill{
        background: var(--btn-bg);
        color: var(--btn-fg);
      }
      .pill:hover{
        transform: translate(-2px,-2px);
        background: var(--dark);
        color: var(--white);
      }
      .pill:focus-visible{ outline:3px solid var(--dark); outline-offset:3px; }

      .footer{
        margin-top:14px;
        text-align:center;
        font-size:14px;
        opacity:.95;
      }
      .footer a{
        color: inherit;
        font-weight:800;
        text-decoration:none;
      }
      .footer a:hover{ text-decoration:underline; }
    </style>
  </head>

  <body>
    <button data-umami-event-location="Dark Mode" data-umami-event-type="Toggle On/Off" data-umami-event-location="Links" id="modeToggle" class="mode-toggle" type="button" aria-label="toggle dark mode">
      <svg class="icon pixel" aria-hidden="true"><use href="#i-moon"/></svg>
      <span id="modeLabel">dark mode</span>
    </button>
    <div class="stars" id="stars"></div>
    <div class="rain" aria-hidden="true"></div>

    <main class="wrap">
      <section class="card" aria-label="GinaCities links">
        <div class="logo">
          <h1 class="title">GinaCities</h1>
          <p class="subtitle">Gina’s Link Page</p>
        </div>

        <p class="meta">👩🏽‍💻 BBC News • 👾 game dev • 💾 retro web vibes</p>

        <nav class="links" aria-label="Links">
          <a data-umami-event="Clicked YouTube" data-umami-event-location="GinaCities Links" class="pill" href="https://youtu.be/sCfOKttghTY" target="_blank" rel="noopener">📺 Why do we crave early internet video</a>
          <a data-umami-event="Clicked Potion Puzzle Shop"  data-umami-event-location="GinaCities Links" class="pill" href="https://ginacities.itch.io/potion-puzzle-shop" target="_blank" rel="noopener">🔮 Play Potion Puzzle Shop</a>
          <!-- <a data-umami-event="Clicked Itch.io"  data-umami-event-location="GinaCities Links" class="pill" href="https://ginacities.itch.io/" target="_blank" rel="noopener">👾 Itch.io: Follow me and play my games!</a> -->
          <!-- <a data-umami-event="Clicked YouTube" data-umami-event-location="GinaCities Links" class="pill" href="https://www.youtube.com/@ginacities" target="_blank" rel="noopener">📺 YouTube</a> -->
          <a data-umami-event="Clicked GinaCities.com"  data-umami-event-location="GinaCities Links" class="pill" href="https://ginacities.com" target="_blank" rel="noopener">👩🏽‍💻 My Website: GinaCities</a>
          <a data-umami-event="Clicked Instagram" data-umami-event-location="GinaCities Links" class="pill" href="https://www.instagram.com/ginacities/" target="_blank" rel="noopener">📷 Instagram</a>
          <a data-umami-event="Clicked TikTok" data-umami-event-location="GinaCities Links" class="pill" href="https://www.tiktok.com/@ginacities" target="_blank" rel="noopener">💥 TikTok</a>
          <a data-umami-event="Clicked BlueSky" data-umami-event-location="GinaCities Links" class="pill" href="https://bsky.app/profile/ginacities.com" target="_blank" rel="noopener">🦋 Bluesky</a>
          
        </nav>

        <div class="footer">
          ✉️ <a href="mailto:gina@ginacities.com">gina@ginacities.com</a>
        </div>
      </section>
    </main>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <symbol id="i-moon" viewBox="0 0 16 16">
          <path d="M9 1a6 6 0 1 0 6 6A5 5 0 0 1 9 1z"/>
        </symbol>
      </defs>
    </svg>

    <script>

    const stars = document.getElementById("stars");
      const COUNT = 26;

      for (let i = 0; i < COUNT; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const size = Math.random() * 2.2 + 1.2;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.left = Math.random() * 100 + "vw";
        s.style.top = Math.random() * 100 + "vh";
        s.style.animationDelay = (Math.random() * 3.5) + "s";
        stars.appendChild(s);
      }

            const rain = document.querySelector('.rain');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!reduce) {
        const GLYPHS = ['✦','❀','✿','✧','✺','✶'];
        function spawnPetal(){
          const s = document.createElement('span');
          s.className = 'petal';
          s.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          const left = Math.random() * 100;
          const dur = 6 + Math.random() * 8;
          const delay = Math.random() * -8;
          const size = 12 + Math.random() * 14;

          s.style.left = left + 'vw';
          s.style.animationDuration = dur + 's';
          s.style.animationDelay = delay + 's';
          s.style.fontSize = size + 'px';
          s.style.color = Math.random() < .5 ? 'var(--violet)' : 'var(--pink)';

          rain.appendChild(s);
          setTimeout(() => s.remove(), (dur + Math.abs(delay)) * 1000 + 100);
        }

        for (let i = 0; i < 18; i++) spawnPetal();
        setInterval(() => { for (let i = 0; i < 3; i++) spawnPetal(); }, 1200);
      }

      // --- dark mode (simplified + persisted) ---
      (function(){
        const root  = document.documentElement;
        const btn   = document.getElementById('modeToggle');
        const label = document.getElementById('modeLabel');

        function applyTheme(theme){
          if (theme === 'dark') {
            root.setAttribute('data-theme', 'dark');
            label.textContent = 'light mode';
            btn.setAttribute('aria-label', 'switch to light mode');
          } else {
            root.removeAttribute('data-theme');
            label.textContent = 'dark mode';
            btn.setAttribute('aria-label', 'switch to dark mode');
          }
        }

        const saved = localStorage.getItem('ginacities-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(saved || (prefersDark ? 'dark' : 'light'));

        btn.addEventListener('click', () => {
          const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          localStorage.setItem('ginacities-theme', next);
        });
      })();
    </script>
    <script data-goatcounter="https://ginacities.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
