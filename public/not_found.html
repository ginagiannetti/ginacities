<!doctype html>
<html lang="en" class="crt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 • GinaCities</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

  <link rel="icon" href="assets/AdobeStock_1668008849.png" sizes="32x32" type="image/png">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="209d67bd-268a-4c17-9a15-a01c26768d9b"></script>
  <style>
    /* ------- (Your site theme essentials) ------- */
    :root{
      --pink: #ffd3ec;
      --lav:#e9ddff;
      --pink-2: #ffd3ec;
      --lav-2:#d9ccff;
      --violet:#a88ff4;
      --ink:#2c2137;
      --white:#fff;
      --shadow:#c1b3ff;
      --dark: #5a5493;
      --bg-url: url('assets/backgrounds/light.jpeg');
      --link: #C683E6;
      --link-hover: #5a5493;
    }
    :root[data-theme="dark"]{
      --bg-url: url('assets/backgrounds/dark.jpeg');
    }

    @font-face {
      font-family: "Harnold Pixel";
      src: url("assets/HarnoldPixel-Regular_demo.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html,body{ height:100%; cursor: url("./assets/cursors/Normal_Select2.ani"), url("./assets/cursors/Normal_Select.cur"), auto; }
    a{ color: var(--link); transition: color .15s ease; }
    a:hover, a:focus-visible{ color:var(--link-hover) }
    a, button, .btn, [role="button"], .clickable {
      cursor: url("./assets/cursors/Link_Select.cur"), url("./assets/cursors/Link_Select.ani"), pointer;
    }

    body{
      margin:0;
      font-family: "Pixelify Sans", sans-serif;
      font-weight: 300;
      letter-spacing: 0.15px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      color: var(--ink);
      background-image: var(--bg-url);
      background-size: contain;
      overflow-x:hidden;
    }

    body::after{
      content:"";
      position:fixed; inset:0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 4px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px);
      pointer-events:none;
      mix-blend-mode: soft-light;
    }

    /* crt */
    .crt { position: relative; filter: contrast(1.1) brightness(0.9) saturate(1.2); image-rendering: pixelated; }
    .crt::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background:
        linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
        linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
      background-size: 100% 2px, 3px 100%;
      animation: crt-flicker 1.2s infinite;
    }
    @keyframes crt-flicker {
      0%   { opacity: 0.95; }
      50%  { opacity: 1; }
      100% { opacity: 0.9; }
    }

    /* Stars + petals */
    .stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }
    .star{
      position:absolute;
      background:#fff;
      border-radius:50%;
      box-shadow:0 0 8px 2px rgba(255,255,255,.7);
      animation: twinkle 3.6s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from{opacity:.35; transform:scale(.75)} to{opacity:1; transform:scale(1.2)} }

    .rain{ position: fixed; inset: 0; pointer-events:none; z-index:0; }
    .petal{
      position:absolute;
      top:-10%;
      font-size:14px;
      opacity:.9;
      filter: drop-shadow(0 0 3px rgba(255,255,255,.6));
      animation: fall linear forwards;
    }
    @keyframes fall{
      to{ transform: translateY(120vh) rotate(360deg); opacity:.95; }
    }
    @media (prefers-reduced-motion: reduce){
      .petal{ animation: none; }
    }

    /* Window styling (your vibe) */
    .window{
      background:#ffffff;
      border:2px solid var(--violet);
      box-shadow: 3px 3px 0 0 var(--shadow);
      overflow:hidden;
    }
    .titlebar{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border:2px solid var(--violet);
      font-family: "Press Start 2P", cursive;
      font-size:12px;
      margin:4px;
      background-color:#dec2ee;
      text-shadow: 1px 1px var(--violet);
    }
    .titlebar .icons{ margin-left:auto; display:flex; gap:6px; }
    .titlebar .dot{
      width:14px; height:14px;
      border:2px solid var(--violet);
      background: var(--pink);
      border-radius:3px;
      box-shadow: inset -2px -2px 0 0 rgba(0,0,0,.06);
    }
    .window .content{
      padding:14px 14px 18px;
      border:2px solid var(--violet);
      margin:4px;
      background:#fff;
    }

    .pill, .btn{
      border:2px solid var(--violet);
      background: var(--lav);
      padding:8px 12px;
      border-radius:10px;
      font-weight:700;
      text-decoration:none;
      color:var(--ink);
      box-shadow: 3px 3px 0 0 var(--shadow);
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .12s ease, background .12s ease;
    }
    .pill:hover, .btn:hover{
      transform: translate(-2px, -2px);
      background: var(--dark);
      color: var(--white);
    }
    .toggle{
        margin: 10px;
    }

    /* ------- 404-specific layout ------- */
    .center-wrap{
      position:relative;
      z-index:1;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px 16px 40px;
    }

    .hero{
      width:min(860px, 100%);
      display:grid;
      gap:16px;
    }

    .logo{
      text-align:center;
      padding:18px 14px;
      border:3px solid var(--violet);
      background:#fff;
      box-shadow: 6px 6px 0 0 var(--shadow);
    }
    .logo .title{
      font-family:"Harnold Pixel", cursive;
      font-size:56px;
      letter-spacing:1px;
      text-shadow: 2px 2px var(--violet);
      margin:0;
    }
    .logo .subtitle{
      margin:6px 0 0;
      font-size:18px;
      text-shadow: 1px 1px var(--violet);
    }

    .dog-area{
      display:grid;
      justify-items:center;
      gap:12px;
    }

    .dog-frame{
      width: 340px;
      max-width: 92vw;
      aspect-ratio: 1 / 1;
      border:2px solid var(--violet);
      box-shadow: 3px 3px 0 0 var(--shadow);
      background: rgba(255,255,255,.7);
      border-radius: 12px;
      padding: 8px;
      display:grid;
      place-items:center;
    }

    iframe#dogIframe{
      width:324px;
      height:324px;
      max-width: 88vw;
      max-height: 88vw;
      border:0;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-top:6px;
    }

    .tiny{
      opacity:.85;
      font-size:.95rem;
      text-align:center;
      margin: 10px 0 0;
    }

    .code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      padding: 10px;
      border: 2px dashed var(--violet);
      background: rgba(255,255,255,.6);
      overflow:auto;
    }

    /* (optional) small badge row */
    .badge-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      margin-top: 14px;
    }
    .badge-row img{
      height:31px;
      image-rendering: pixelated;
      border:2px solid var(--violet);
      background:#fff;
      box-shadow: 3px 3px 0 0 var(--shadow);
    }

    /* Dark theme adjustments so your window stays readable */
    :root[data-theme="dark"] .window .content { background: #5a5493; color:#fff; }
    :root[data-theme="dark"] .window { background: #5a5493; }
    :root[data-theme="dark"] .logo { background:#5a5493; color:#fff; }
    :root[data-theme="dark"] .logo .title, 
    :root[data-theme="dark"] .logo .subtitle { color:#fff; }

    @media (max-width: 700px){
  .window .content{
    padding: 0;
  }
}

  </style>
</head>

<body>
  <button data-umami-event-location="Dark Mode" data-umami-event-type="Toggle On/Off" data-umami-event-location="404" id="modeToggle" class="btn toggle" type="button" aria-label="toggle dark mode">
    🌙 <span id="modeLabel">dark mode</span>
  </button>
  <div class="stars" id="stars"></div>
  <div class="rain" aria-hidden="true"></div>

  <main class="center-wrap">
    <div class="hero">
      <header class="logo" aria-label="GinaCities header">
        <h1 class="title">Oh no! You seem to be lost!</h1>
        <p class="subtitle">Please stay for a while</p>
      </header>

      <section class="window" aria-label="404 content window">
        <div class="titlebar">
          <span>404 • lost in the cosmic corner</span>
          <div class="icons"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        </div>

        <div class="content">
          <div class="dog-area">
            <div class="dog-frame">
              <iframe id="dogIframe"
                src="https://ginacities.com/doggy/?embed=1&dog=Corgi&variant=0&room=cute"
                allow="gamepad *"
                title="Virtual doggy">
              </iframe>
            </div>

            <p class="tiny" id="dogMeta">Loading doggy…</p>

            <div class="actions">
              <a data-umami-event="Clicked Random Dog"  data-umami-event-location="GinaCities 404" class="pill" id="randomDogBtn" type="button">🎲 random dog</a>
              <a data-umami-event="Clicked Itch.io"  data-umami-event-location="GinaCities 404" class="pill" href="https://ginacities.itch.io" target="_blank" rel="noreferrer">🎮 games</a>
            </div>

            <div class="badge-row" aria-label="buttons">
              <a data-umami-event="Clicked GinaCities.com"  data-umami-event-location="GinaCities 404" href="https://ginacities.com" target="_blank" rel="noreferrer">
                <img src="https://ginacities.com/assets/banners/GinaCities.gif" alt="GinaCities banner" loading="lazy" width="88" height="30">
              </a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    // ------------------ sparkles + petals (your style) ------------------
    const box = document.getElementById('stars');
    for(let i=0;i<40;i++){
      const s = document.createElement('div');
      const size = Math.random()*3 + 2;
      s.className='star';
      s.style.width = s.style.height = size + 'px';
      s.style.top = (Math.random()*100) + '%';
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDuration = (2 + Math.random()*3) + 's';
      box.appendChild(s);
    }

    const rain = document.querySelector('.rain');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) {
      const GLYPHS = ['✦','❀','✿','✧','✺','✶'];
      function spawnPetal(){
        const s = document.createElement('span');
        s.className = 'petal';
        s.textContent = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
        const left = Math.random()*100;
        const dur = 6 + Math.random()*8;
        const delay = Math.random()*-8;
        const size = 12 + Math.random()*14;
        s.style.left = left + 'vw';
        s.style.animationDuration = dur + 's';
        s.style.animationDelay = delay + 's';
        s.style.fontSize = size + 'px';
        s.style.color = Math.random() < .5 ? 'var(--violet)' : 'var(--pink-2)';
        rain.appendChild(s);
        setTimeout(() => s.remove(), (dur + Math.abs(delay))*1000 + 100);
      }
      for (let i=0;i<24;i++) spawnPetal();
      setInterval(() => { for (let i=0;i<4;i++) spawnPetal(); }, 1200);
    }

    // ------------------ 404 dog randomiser ------------------
    const VARIANT_COUNTS = {
      "Corgi": 4,
      "Chihuahua": 3,
      "bull_terrier": 2,
      "mini_poodle": 3,
      "Pug": 2,
      "Papillon": 3,
    };

    const ROOMS = ["cute", "goth", "leaf", "blue", "xmas"];

    const dogIframe = document.getElementById('dogIframe');
    const dogMeta = document.getElementById('dogMeta');

    function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
    function randomInt(min, maxInclusive){
      return Math.floor(Math.random() * (maxInclusive - min + 1)) + min;
    }

    function buildDogUrl({ dog, variant, room }){
      const base = "https://ginacities.com/doggy/";
      const params = new URLSearchParams();
      params.set("embed", "1");
      params.set("dog", dog);
      params.set("variant", String(variant));
      params.set("room", room);
      return `${base}?${params.toString()}`;
    }

    function rollDog(){
      const dog = pickRandom(Object.keys(VARIANT_COUNTS));
      const maxVar = (VARIANT_COUNTS[dog] ?? 1) - 1;
      const variant = randomInt(0, Math.max(0, maxVar));
      const room = pickRandom(ROOMS);
      return { dog, variant, room };
    }

    function setDog({ dog, variant, room }){
      const url = buildDogUrl({ dog, variant, room });
      dogIframe.src = url;

      dogMeta.textContent = `You found a ${dog} in the ${room} room`;
    }

    let current = { dog: "Corgi", variant: 0, room: "cute" };

    function setCurrent(next){
      current = next;
      setDog(next);
    }

    document.getElementById('randomDogBtn').addEventListener('click', () => {
      setDog(rollDog());
    });

    // First load: randomise everything
    (function init(){
      const dog = pickRandom(Object.keys(VARIANT_COUNTS));
      const variant = randomInt(0, (VARIANT_COUNTS[dog] ?? 1) - 1);
      const room = pickRandom(ROOMS);
      setCurrent({ dog, variant, room });
    })();

    // ------------------ dark/light toggle------------------
    (function(){
      const root = document.documentElement;
      const btn = document.getElementById('modeToggle');
      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        if (next === 'dark') root.setAttribute('data-theme','dark');
        else root.removeAttribute('data-theme');
      });
    })();
  </script>
</body>
</html>
</p></span></h1></div></html>
